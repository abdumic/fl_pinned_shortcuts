plugins {
    id "com.android.library"
}

group = "com.hudasoft.fl_pinned_shortcuts"
version = "0.1.1"

android {
    namespace = "com.hudasoft.fl_pinned_shortcuts"
    compileSdk = 35

    defaultConfig {
        minSdk = 21
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

// Flutter 3.44+ / AGP 9+ built-in Kotlin.
// Do not apply org.jetbrains.kotlin.android here.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
